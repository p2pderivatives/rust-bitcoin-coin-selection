on: [push, pull_request]

name: Continuous integration

jobs:
  Tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
        include:
          - toolchain: "nightly"
            env:
              DO_LINT: true
              DO_FEATURE_MATRIX: false 
          - toolchain: "beta"
            env:
              DO_LINT: false
              DO_FEATURE_MATRIX: false 
          - toolchain: "stable"
            env:
              DO_LINT: false
              DO_FEATURE_MATRIX: true
    steps:
      - name: Checkout Crate
        uses: actions/checkout@v7
      - name: Checkout Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run Tests
        env: ${{ matrix.env }}
        run: ./contrib/test.sh
